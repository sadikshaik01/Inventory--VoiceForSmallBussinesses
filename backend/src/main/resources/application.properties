spring.application.name=VoiceStock
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:postgres}
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
